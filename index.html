<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENAI-GPT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Barra lateral"></aside>

      <main class="main-panel">
        <button class="theme-toggle" type="button" aria-label="Alternar modo de visualização" aria-pressed="false" title="Ativar modo escuro">
          <img src="Image/sun 1.png" alt="Botão de sol" class="sun-icon" />
        </button>

        <section class="brand-area" aria-label="Logo e nome do projeto">
          <img src="Image/SENAI-AI 1.png" alt="Robô SENAI" class="robot-logo" />
          <h1>SENAI-GPT</h1>
        </section>

        <section class="chat-input-area" aria-label="Campo de pergunta">
          <div class="input-wrap">
            <input type="text" placeholder="Pergunte algo..." aria-label="Pergunte algo" />
          </div>
          <button class="send-button" type="button" aria-label="Enviar pergunta">
            <img src="Image/paper-plane-solid-full 1.png" alt="Enviar mensagem" class="send-icon" />
          </button>
        </section>

        <div class="footer-logo" aria-label="Logo do SENAI">
          <img src="Image/senai_logo.png" alt="Logo SENAI" />
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
